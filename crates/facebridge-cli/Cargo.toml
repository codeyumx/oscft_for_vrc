[package]
name = "facebridge-cli"
description = "Headless FaceBridge: run the engine, install and manage tracking modules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "facebridge-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
fb-core = { path = "../fb-core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
