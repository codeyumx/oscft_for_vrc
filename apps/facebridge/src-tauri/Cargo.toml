[package]
name = "facebridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "OSCFT for VRC desktop app: runs VRCFaceTracking modules and sends face tracking to VRChat over OSC"
default-run = "facebridge"

[lib]
name = "facebridge_app"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fb-core = { path = "../../../crates/fb-core" }
fb-osc = { path = "../../../crates/fb-osc" }
fb-tracking = { path = "../../../crates/fb-tracking" }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
ureq = { version = "3.5", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
