<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>OSCFT for VRC</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <img src="logo.png" alt="" width="32" height="32" />
          <div>
            <div class="brand-name">OSCFT for VRC</div>
            <div class="brand-sub">
              <span id="brand-version"></span>
              <button type="button" class="update-badge" id="app-update" hidden>Update</button>
            </div>
          </div>
        </div>
        <nav aria-label="Main">
          <ul id="nav"></ul>
        </nav>
        <div class="sidebar-status" id="sidebar-status" role="status" aria-live="polite"></div>
      </aside>
      <main id="main" tabindex="-1"></main>
    </div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  </body>
</html>
