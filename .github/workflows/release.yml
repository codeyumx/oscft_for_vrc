# Optional release pipeline. Never runs on ordinary pushes: only when a `v*` tag is pushed or when started by hand
# (Actions → Release → Run workflow). Runs the Rust and .NET tests, builds the assets with scripts/release.sh
# (Linux; the Windows app is cross-built with cargo-xwin) and, for a tag or `publish: true`, uploads them to a
# draft GitHub release for that tag. Started by hand it can build one platform only, e.g. the Linux assets for a
# draft whose Windows assets were built locally. A release that is already published is never changed. Review the
# draft and publish it yourself.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the assets to a draft release for the version in Cargo.toml (otherwise build artifacts only)"
        type: boolean
        default: false
      platforms:
        description: "Which assets to build"
        type: choice
        options: [all, linux-x64, win-x64]
        default: all

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            clang lld llvm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: cargo-xwin
        if: inputs.platforms != 'linux-x64'
        run: cargo install --locked cargo-xwin

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: .NET tests
        run: dotnet test dotnet/FaceBridge.slnx --nologo

      - name: Build release assets
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          if [[ "$PLATFORMS" == all ]]; then scripts/release.sh; else scripts/release.sh "$PLATFORMS"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: OSCFT-for-VRC-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Upload to draft release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != true ]]; then
              echo "::warning::$TAG is already published; its assets are left as they are"
              exit 0
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "OSCFT for VRC ${{ steps.version.outputs.version }}" --notes "Release notes to be written."
          fi
          gh release upload "$TAG" dist/* --clobber
